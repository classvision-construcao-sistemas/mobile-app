<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024"><rect width="1440" height="1024" fill="#F5F7FA"/><rect x="382" y="132" width="676" height="760" rx="28" fill="#FFF"/><circle cx="720" cy="252" r="55" fill="#DCFCE7"/><text x="720" y="270" text-anchor="middle" font-family="Inter,Arial" font-size="48" font-weight="700" fill="#15803D">✓</text><text x="720" y="348" text-anchor="middle" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#1A1A2E">Instituição cadastrada!</text><text x="720" y="382" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#6B7280">O Colégio Horizonte foi criado com sucesso.</text><rect x="438" y="430" width="564" height="158" rx="16" fill="#F8FAFC"/><text x="470" y="469" font-family="Inter,Arial" font-size="12" fill="#6B7280">PRIMEIRO ADMINISTRADOR</text><text x="470" y="506" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#1A1A2E">Paulo Nunes</text><text x="470" y="532" font-family="Inter,Arial" font-size="13" fill="#6B7280">paulo@horizonte.edu.br</text><rect x="790" y="482" width="174" height="28" rx="14" fill="#FEF3C7"/><text x="877" y="501" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#B45309">Convite enviado</text><text x="470" y="565" font-family="Inter,Arial" font-size="11" fill="#6B7280">O convite de primeiro acesso é válido por 7 dias.</text><rect x="438" y="632" width="564" height="52" rx="12" fill="#2563EB"/><text x="720" y="665" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#FFF">Ver instituição</text><rect x="438" y="700" width="564" height="52" rx="12" fill="#FFF" stroke="#E5E7EB"/><text x="720" y="733" text-anchor="middle" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#1A1A2E">Cadastrar outra instituição</text><text x="720" y="812" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#2563EB">Voltar para Instituições</text></svg>
