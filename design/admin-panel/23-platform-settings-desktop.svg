<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024"><rect width="1440" height="1024" fill="#F5F7FA"/><rect width="252" height="1024" fill="#0F172A"/><text x="28" y="54" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#FFF">✦ ClassVision</text><text x="28" y="89" font-family="Inter,Arial" font-size="10" fill="#94A3B8">ADMINISTRAÇÃO GLOBAL</text><text x="34" y="148" font-family="Inter,Arial" font-size="14" fill="#CBD5E1">▦  Visão geral</text><text x="34" y="194" font-family="Inter,Arial" font-size="14" fill="#CBD5E1">▤  Instituições</text><text x="34" y="240" font-family="Inter,Arial" font-size="14" fill="#CBD5E1">♙  Administradores</text><text x="34" y="286" font-family="Inter,Arial" font-size="14" fill="#CBD5E1">⌁  Atividade</text><rect x="16" y="311" width="220" height="46" rx="12" fill="#1E3A8A"/><text x="34" y="340" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#FFF">⚙  Configurações</text><text x="292" y="62" font-family="Inter,Arial" font-size="28" font-weight="700" fill="#1A1A2E">Configurações da plataforma</text><text x="292" y="88" font-family="Inter,Arial" font-size="14" fill="#6B7280">Políticas globais, convites e disponibilidade.</text><rect x="292" y="126" width="1056" height="218" rx="16" fill="#FFF"/><text x="318" y="169" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#1A1A2E">Política de convites</text><text x="318" y="210" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#1A1A2E">Validade do convite</text><text x="318" y="232" font-family="Inter,Arial" font-size="11" fill="#6B7280">Prazo para primeiro acesso do administrador.</text><rect x="1120" y="194" width="182" height="44" rx="10" fill="#FFF" stroke="#E5E7EB"/><text x="1211" y="222" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#1A1A2E">7 dias ⌄</text><text x="318" y="287" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#1A1A2E">Reenvio automático</text><text x="318" y="309" font-family="Inter,Arial" font-size="11" fill="#6B7280">Lembrar convites não aceitos após 48 horas.</text><rect x="1236" y="276" width="48" height="26" rx="13" fill="#2563EB"/><circle cx="1271" cy="289" r="10" fill="#FFF"/><rect x="292" y="368" width="1056" height="258" rx="16" fill="#FFF"/><text x="318" y="411" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#1A1A2E">Status dos serviços</text><text x="318" y="458" font-family="Inter,Arial" font-size="13" fill="#1A1A2E">API principal</text><text x="1256" y="458" text-anchor="end" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#15803D">Operacional</text><text x="318" y="506" font-family="Inter,Arial" font-size="13" fill="#1A1A2E">Reconhecimento facial</text><text x="1256" y="506" text-anchor="end" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#15803D">Operacional</text><text x="318" y="554" font-family="Inter,Arial" font-size="13" fill="#1A1A2E">Envio de e-mails</text><text x="1256" y="554" text-anchor="end" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#B45309">Degradado</text><rect x="1180" y="572" width="122" height="36" rx="10" fill="#EFF6FF"/><text x="1241" y="595" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#2563EB">Ver detalhes</text></svg>
